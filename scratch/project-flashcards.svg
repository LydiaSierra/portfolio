<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F0EB"/>
      <stop offset="100%" stop-color="#ECE5DC"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#2E2A27" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>

  <!-- Top App Navigation Bar -->
  <rect x="40" y="30" width="720" height="50" rx="8" fill="#FFFFFF"/>
  <circle cx="65" cy="55" r="6" fill="#F2D5D5"/>
  <circle cx="85" cy="55" r="6" fill="#7BCBC4"/>
  <circle cx="105" cy="55" r="6" fill="#4A5D4E"/>
  <rect x="135" y="48" width="120" height="14" rx="4" fill="#E8E3DD"/>
  <rect x="630" y="44" width="100" height="22" rx="11" fill="#EAE5DE"/>

  <!-- Stats Cards Row -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="70" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="20" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7A746E">TOTAL CARDS</text>
    <text x="20" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#2E2A27">48</text>

    <rect x="250" y="0" width="220" height="70" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="270" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7A746E">MASTERED</text>
    <text x="270" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#4A5D4E">36</text>

    <rect x="500" y="0" width="220" height="70" rx="10" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <text x="520" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#7A746E">STUDY STREAK</text>
    <text x="520" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#2D7D76">7 Days</text>
  </g>

  <!-- Interactive Study Card (Focal Point) -->
  <g transform="translate(150, 195)">
    <rect x="0" y="0" width="500" height="260" rx="16" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="70" height="24" rx="12" fill="#E8F7F5"/>
    <text x="40" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#2D7D76">ANGULAR</text>

    <text x="24" y="90" font-family="Georgia, serif" font-size="22" font-weight="500" fill="#2E2A27">How do Signals improve reactivity?</text>
    <text x="24" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6E6862">Fine-grained change detection without Zone.js overhead.</text>

    <!-- Progress Line -->
    <rect x="24" y="180" width="452" height="6" rx="3" fill="#F0ECE7"/>
    <rect x="24" y="180" width="340" height="6" rx="3" fill="#4A5D4E"/>

    <!-- Bottom Action Pill Buttons -->
    <rect x="24" y="206" width="90" height="32" rx="6" fill="#FBF9F7" stroke="#E6E1DC"/>
    <text x="46" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#2E2A27">Previous</text>

    <rect x="124" y="206" width="90" height="32" rx="6" fill="#4A5D4E"/>
    <text x="156" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Next</text>
  </g>
</svg>
