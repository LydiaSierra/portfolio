<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="portGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F7"/>
      <stop offset="100%" stop-color="#F0ECE7"/>
    </linearGradient>
    <filter id="portShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#2E2A27" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="500" rx="16" fill="url(#portGrad)"/>

  <!-- Left: Code Editor Anatomy -->
  <g transform="translate(36, 40)">
    <rect width="330" height="420" rx="12" fill="#24201D" filter="url(#portShadow)"/>
    <!-- Window Bar -->
    <rect width="330" height="38" rx="12" fill="#1C1816"/>
    <circle cx="20" cy="19" r="5" fill="#D48B8B"/>
    <circle cx="36" cy="19" r="5" fill="#E8C88A"/>
    <circle cx="52" cy="19" r="5" fill="#7BCBC4"/>
    <text x="80" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A8A199">portfolio / js / i18n.js</text>

    <!-- Code Lines -->
    <g transform="translate(20, 58)" font-family="'JetBrains Mono', monospace" font-size="11.5" line-height="1.6">
      <text y="20" fill="#6E8E74">// Zero Build Tools &amp; Native ES Modules</text>
      <text y="42" fill="#F2D5D5">export const</text> <text x="96" y="42" fill="#7BCBC4">config</text> <text x="144" y="42" fill="#F5F2EE">=</text> <text x="156" y="42" fill="#E6E1DC">{</text>
      <text x="16" y="64" fill="#A8A199">stack:</text> <text x="68" y="64" fill="#9EC4A7">'Vanilla JS'</text><text x="154" y="64" fill="#F5F2EE">,</text>
      <text x="16" y="86" fill="#A8A199">theme:</text> <text x="68" y="86" fill="#7BCBC4">'system-aware'</text><text x="166" y="86" fill="#F5F2EE">,</text>
      <text x="16" y="108" fill="#A8A199">a11y:</text> <text x="68" y="108" fill="#E8C88A">'WCAG 2.1 AA'</text><text x="154" y="108" fill="#F5F2EE">,</text>
      <text x="16" y="130" fill="#A8A199">locales:</text> <text x="80" y="130" fill="#F5F2EE">[</text><text x="90" y="130" fill="#9EC4A7">'en'</text><text x="118" y="130" fill="#F5F2EE">,</text> <text x="128" y="130" fill="#9EC4A7">'es'</text><text x="156" y="130" fill="#F5F2EE">]</text>
      <text y="152" fill="#E6E1DC">};</text>

      <text y="190" fill="#6E8E74">/* CSS Custom Property Design Tokens */</text>
      <text y="212" fill="#F2D5D5">:root</text> <text x="42" y="212" fill="#F5F2EE">{</text>
      <text x="16" y="234" fill="#A8A199">--color-primary:</text> <text x="138" y="234" fill="#7BCBC4">#4A5D4E</text><text x="194" y="234" fill="#F5F2EE">;</text>
      <text x="16" y="256" fill="#A8A199">--color-bg:</text> <text x="138" y="256" fill="#9EC4A7">#F8F5F2</text><text x="194" y="256" fill="#F5F2EE">;</text>
      <text x="16" y="278" fill="#A8A199">--font-display:</text> <text x="138" y="278" fill="#E8C88A">'Instrument'</text><text x="224" y="278" fill="#F5F2EE">;</text>
      <text y="300" fill="#F5F2EE">}</text>

      <rect x="0" y="324" width="290" height="26" rx="6" fill="#2E2A27"/>
      <text x="12" y="341" fill="#7BCBC4" font-size="10.5">✔ 126/126 a11y tests passing</text>
    </g>
  </g>

  <!-- Right: Rendered Portfolio Browser Window -->
  <g transform="translate(390, 40)">
    <rect width="374" height="420" rx="12" fill="#FFFFFF" filter="url(#portShadow)"/>
    <!-- Browser Top Bar -->
    <rect width="374" height="38" rx="12" fill="#F8F5F2"/>
    <rect x="18" y="11" width="160" height="16" rx="8" fill="#FFFFFF" stroke="#E6E1DC"/>
    <text x="32" y="23" font-family="'Inter', sans-serif" font-size="9" fill="#6E6862">lydiasierra.dev</text>
    <rect x="290" y="10" width="32" height="18" rx="9" fill="#E6E1DC"/>
    <circle cx="300" cy="19" r="6" fill="#4A5D4E"/>
    <rect x="330" y="10" width="26" height="18" rx="4" fill="#E8F7F5"/>
    <text x="336" y="22" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#25726B">EN</text>

    <!-- Content Area -->
    <g transform="translate(24, 56)">
      <!-- Greeting Pill -->
      <rect width="100" height="20" rx="10" fill="#FBF9F7" stroke="#E6E1DC"/>
      <text x="12" y="14" font-family="'Inter', sans-serif" font-size="9.5" fill="#6E6862">Hi, I'm Lydia ☕</text>

      <!-- Headline -->
      <text y="52" font-family="'Instrument Serif', serif" font-size="24" fill="#2E2A27">Full Stack Developer</text>
      <text y="78" font-family="'Instrument Serif', serif" font-size="24" fill="#2E2A27">building <tspan font-style="italic" fill="#25726B">meaningful</tspan></text>
      <text y="104" font-family="'Instrument Serif', serif" font-size="24" fill="#2E2A27">digital experiences.</text>

      <!-- Buttons -->
      <rect x="0" y="126" width="110" height="28" rx="6" fill="#4A5D4E"/>
      <text x="16" y="144" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#FFFFFF">View projects →</text>

      <rect x="120" y="126" width="90" height="28" rx="6" fill="#F8F5F2" stroke="#E6E1DC"/>
      <text x="136" y="144" font-family="'Inter', sans-serif" font-size="10" fill="#2E2A27">Resume CV</text>

      <!-- Arch Preview Visual Card -->
      <g transform="translate(0, 172)">
        <rect width="326" height="160" rx="10" fill="#FBF9F7" stroke="#F0ECE7"/>
        <rect x="16" y="16" width="90" height="128" rx="45" fill="#4A5D4E" opacity="0.15"/>
        <text x="120" y="44" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#2E2A27">Botanical Arch Component</text>
        <text x="120" y="66" font-family="'Inter', sans-serif" font-size="9.5" fill="#6E6862">Responsive side-by-side layout</text>
        <text x="120" y="84" font-family="'Inter', sans-serif" font-size="9.5" fill="#6E6862">Synchronized dark/light assets</text>

        <!-- Metric Badges -->
        <rect x="120" y="106" width="90" height="22" rx="11" fill="#E8F7F5"/>
        <text x="130" y="121" font-family="'JetBrains Mono', monospace" font-size="9" fill="#25726B">0.0s LCP Delay</text>

        <rect x="218" y="106" width="86" height="22" rx="11" fill="#F2D5D5" opacity="0.6"/>
        <text x="228" y="121" font-family="'JetBrains Mono', monospace" font-size="9" fill="#8A4B4B">100 a11y Score</text>
      </g>
    </g>
  </g>
</svg>